name: Release Game Binary

on:
  push:
    tags:
      - 'game-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., 1.5.2)'
        required: true
        default: '1.5.2'

jobs:
  # Build DesktopGL Content (shaders, fonts) on Windows for Linux
  build-desktopgl-content:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      
      - name: Install MGCB
        run: dotnet tool install -g dotnet-mgcb
      
      - name: Build DesktopGL Content (Shaders only)
        working-directory: ladxhd_game_source_code/Content
        run: |
          # Create output directory
          mkdir -p desktopgl-shaders
          
          # Build each shader for DesktopGL
          $shaders = Get-ChildItem -Path "Shader/*.fx"
          foreach ($shader in $shaders) {
            $name = $shader.BaseName
            Write-Host "Building $name for DesktopGL..."
            mgcb /platform:DesktopGL /build:"Shader/$($shader.Name)" /outputDir:desktopgl-shaders /intermediateDir:obj/DesktopGL
          }
          
          # List compiled shaders
          Get-ChildItem -Path "desktopgl-shaders" -Recurse
      
      - name: Upload DesktopGL Content
        uses: actions/upload-artifact@v4
        with:
          name: desktopgl-content
          path: ladxhd_game_source_code/Content/desktopgl-shaders/

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      
      - name: Restore dependencies
        working-directory: ladxhd_game_source_code
        run: dotnet restore -p:TargetPlatformName=Windows -p:SkipContentBuild=true
      
      - name: Build and Publish Windows
        working-directory: ladxhd_game_source_code
        run: |
          dotnet publish ProjectZ.csproj -c Release -r win-x64 `
            -p:TargetPlatformName=Windows `
            -p:SkipContentBuild=true `
            -p:PublishSingleFile=true `
            --self-contained true `
            -o ../publish/Windows
      
      - name: Package Windows Release
        run: |
          # Remove Content/Data folders if they exist (shouldn't be there but safety check)
          if (Test-Path "publish/Windows/Content") { Remove-Item -Recurse -Force "publish/Windows/Content" }
          if (Test-Path "publish/Windows/Data") { Remove-Item -Recurse -Force "publish/Windows/Data" }
          
          # Create zip with just the executable
          Compress-Archive -Path "publish/Windows/*" -DestinationPath "LADXHD-Windows-x64.zip"
      
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: LADXHD-Windows-x64.zip

  build-linux:
    needs: [build-desktopgl-content]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      
      - name: Restore dependencies
        working-directory: ladxhd_game_source_code
        run: dotnet restore -p:TargetPlatformName=Linux -p:SkipContentBuild=true
      
      - name: Build and Publish Linux
        working-directory: ladxhd_game_source_code
        run: |
          dotnet publish ProjectZ.csproj -c Release -r linux-x64 \
            -p:TargetPlatformName=Linux \
            -p:SkipContentBuild=true \
            -p:PublishSingleFile=true \
            --self-contained true \
            -o ../publish/Linux
      
      - name: Download DesktopGL Content
        uses: actions/download-artifact@v4
        with:
          name: desktopgl-content
          path: ./desktopgl-content
      
      - name: Package Linux Release
        run: |
          # Remove Content/Data folders if they exist (shouldn't be there but safety check)
          rm -rf publish/Linux/Content publish/Linux/Data 2>/dev/null || true
          
          # Create DesktopGL-Shaders folder with pre-compiled shaders for Linux
          mkdir -p publish/Linux/DesktopGL-Shaders
          cp -r desktopgl-content/* publish/Linux/DesktopGL-Shaders/ || true
          
          # Make executable
          chmod +x "publish/Linux/Link's Awakening DX HD"
          
          # Create tarball
          tar -czvf LADXHD-Linux-x64.tar.gz -C publish/Linux .
      
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: LADXHD-Linux-x64.tar.gz

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: ./release
      
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: ./release
      
      - name: Get version from tag
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/game-v}" >> $GITHUB_OUTPUT
          fi
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('game-v{0}', steps.version.outputs.VERSION) || github.ref_name }}
          name: "Link's Awakening DX HD v${{ steps.version.outputs.VERSION }}"
          draft: false
          prerelease: false
          body: |
            ## Link's Awakening DX HD v${{ steps.version.outputs.VERSION }}
            
            ### ⚠️ Important: Original Game Assets Required
            
            This release contains **only the game binary** with embedded patches.
            
            **You must provide your own v1.0.0 game assets** (Content and Data folders) from the original release.
            
            ### Installation
            
            #### Windows
            1. Download and extract `LADXHD-Windows-x64.zip`
            2. Copy the `Content` and `Data` folders from your original **Link's Awakening DX HD v1.0.0** installation
            3. Run the game - it will automatically patch your assets on first launch
            
            #### Linux
            1. Download and extract `LADXHD-Linux-x64.tar.gz`
            2. Copy the `Content` and `Data` folders from your original **Link's Awakening DX HD v1.0.0** installation
            3. **Important**: Copy the contents of the included `DesktopGL-Shaders` folder into `Content/Shader/` (replacing the Windows shaders)
            4. Run the game - it will automatically patch your assets on first launch
            
            ### Linux Requirements
            
            - `xdelta3` for auto-patching:
              - **Arch Linux**: `sudo pacman -S xdelta3`
              - **Ubuntu/Debian**: `sudo apt install xdelta3`
              - **Fedora**: `sudo dnf install xdelta3`
            
            ### Downloads
            
            - **Windows (x64)**: `LADXHD-Windows-x64.zip`
            - **Linux (x64)**: `LADXHD-Linux-x64.tar.gz` (includes DesktopGL shaders)
          files: |
            ./release/LADXHD-Windows-x64.zip
            ./release/LADXHD-Linux-x64.tar.gz

name: Release Game Binary

on:
  push:
    tags:
      - 'game-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., 1.5.2)'
        required: true
        default: '1.5.2'

jobs:
  # =============================================================================
  # Compile ALL Content (shaders, fonts, textures) for both platforms
  # =============================================================================
  # Shaders are NOT copyrighted - they're part of our source code.
  # We compile them on Windows because mgfxc requires d3dcompiler_47.dll
  # This works for both DirectX (Windows) and OpenGL (DesktopGL/Linux) targets.
  # =============================================================================
  build-content:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      - name: Install MGCB
        run: dotnet tool install -g dotnet-mgcb
      
      - name: Compile Windows Shaders (DirectX)
        working-directory: ladxhd_game_source_code/Content
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "compiled/Windows/Shader"
          
          $shaders = Get-ChildItem -Path "Shader/*.fx"
          foreach ($shader in $shaders) {
            $name = $shader.BaseName
            Write-Host "Building $name for Windows (DirectX)..."
            mgcb /platform:Windows /profile:HiDef /importer:EffectImporter /processor:EffectProcessor /outputDir:compiled/Windows /intermediateDir:obj/Windows /build:"Shader/$($shader.Name)"
          }
          
          Write-Host ""
          Write-Host "Windows shaders compiled:"
          Get-ChildItem -Path "compiled/Windows/Shader" -Recurse
      
      - name: Compile DesktopGL Shaders (OpenGL)
        working-directory: ladxhd_game_source_code/Content
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "compiled/DesktopGL/Shader"
          
          $shaders = Get-ChildItem -Path "Shader/*.fx"
          foreach ($shader in $shaders) {
            $name = $shader.BaseName
            Write-Host "Building $name for DesktopGL (OpenGL)..."
            mgcb /platform:DesktopGL /profile:HiDef /importer:EffectImporter /processor:EffectProcessor /outputDir:compiled/DesktopGL /intermediateDir:obj/DesktopGL /build:"Shader/$($shader.Name)"
          }
          
          Write-Host ""
          Write-Host "DesktopGL shaders compiled:"
          Get-ChildItem -Path "compiled/DesktopGL/Shader" -Recurse
      
      - name: Upload Windows Content
        uses: actions/upload-artifact@v4
        with:
          name: content-windows
          path: ladxhd_game_source_code/Content/compiled/Windows/
          retention-days: 1
      
      - name: Upload DesktopGL Content  
        uses: actions/upload-artifact@v4
        with:
          name: content-desktopgl
          path: ladxhd_game_source_code/Content/compiled/DesktopGL/
          retention-days: 1

  # =============================================================================
  # Build Windows Binary
  # =============================================================================
  build-windows:
    needs: [build-content]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      - name: Restore dependencies
        working-directory: ladxhd_game_source_code
        run: dotnet restore -p:TargetPlatformName=Windows -p:SkipContentBuild=true
      
      - name: Build and Publish Windows
        working-directory: ladxhd_game_source_code
        run: |
          dotnet publish ProjectZ.csproj -c Release -r win-x64 `
            -p:TargetPlatformName=Windows `
            -p:SkipContentBuild=true `
            -p:PublishSingleFile=true `
            --self-contained true `
            -o ../publish/Windows
      
      - name: Download Windows Shaders
        uses: actions/download-artifact@v4
        with:
          name: content-windows
          path: ./content-windows
      
      - name: Package Windows Release
        shell: pwsh
        run: |
          # Include pre-compiled Windows shaders in Shaders-Windows folder
          # ShaderPatcher will auto-install these to Content/Shader/ on first run
          New-Item -ItemType Directory -Force -Path "publish/Windows/Shaders-Windows"
          Copy-Item -Path "content-windows/Shader/*" -Destination "publish/Windows/Shaders-Windows/" -Force
          
          # Also include setup script
          Copy-Item -Path "setup_linux_assets.sh" -Destination "publish/Windows/" -ErrorAction SilentlyContinue
          
          # Remove debug files
          Remove-Item -Path "publish/Windows/*.pdb" -Force -ErrorAction SilentlyContinue
          
          # Create zip
          Compress-Archive -Path "publish/Windows/*" -DestinationPath "LADXHD-Windows-x64.zip" -Force
      
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: LADXHD-Windows-x64.zip

  # =============================================================================
  # Build Linux Binary
  # =============================================================================
  build-linux:
    needs: [build-content]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      - name: Restore dependencies
        working-directory: ladxhd_game_source_code
        run: dotnet restore -p:TargetPlatformName=Linux -p:SkipContentBuild=true
      
      - name: Build and Publish Linux
        working-directory: ladxhd_game_source_code
        run: |
          dotnet publish ProjectZ.csproj -c Release -r linux-x64 \
            -p:TargetPlatformName=Linux \
            -p:SkipContentBuild=true \
            -p:PublishSingleFile=true \
            --self-contained true \
            -o ../publish/Linux
      
      - name: Download DesktopGL Shaders
        uses: actions/download-artifact@v4
        with:
          name: content-desktopgl
          path: ./content-desktopgl
      
      - name: Package Linux Release
        run: |
          # Include pre-compiled DesktopGL shaders in Shaders-DesktopGL folder
          # ShaderPatcher will auto-install these to Content/Shader/ on first run
          mkdir -p publish/Linux/Shaders-DesktopGL
          cp -r content-desktopgl/Shader/* publish/Linux/Shaders-DesktopGL/
          
          # Include setup script for advanced users
          cp setup_linux_assets.sh publish/Linux/ || true
          
          # Remove debug files
          rm -f publish/Linux/*.pdb 2>/dev/null || true
          
          # Make executable
          chmod +x "publish/Linux/Link's Awakening DX HD"
          chmod +x publish/Linux/setup_linux_assets.sh 2>/dev/null || true
          
          # Create tarball
          tar -czvf LADXHD-Linux-x64.tar.gz -C publish/Linux .
      
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: LADXHD-Linux-x64.tar.gz

  # =============================================================================
  # Create GitHub Release
  # =============================================================================
  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: ./release
      
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: ./release
      
      - name: Get version from tag
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/game-v}" >> $GITHUB_OUTPUT
          fi
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('game-v{0}', steps.version.outputs.VERSION) || github.ref_name }}
          name: "Link's Awakening DX HD v${{ steps.version.outputs.VERSION }}"
          draft: false
          prerelease: false
          body: |
            ## Link's Awakening DX HD v${{ steps.version.outputs.VERSION }}
            
            ### ⚠️ Important: Original Game Assets Required
            
            This release contains the **game binary with pre-compiled shaders** and embedded patches.
            
            **You must provide your own v1.0.0 game assets** (Content and Data folders) from the original release.
            
            ---
            
            ### Installation
            
            #### Windows
            1. Download and extract `LADXHD-Windows-x64.zip`
            2. Copy the `Content` and `Data` folders from your **Link's Awakening DX HD v1.0.0** installation
            3. Run the game
               - Shaders will be automatically installed from `Shaders-Windows/`
               - Assets will be automatically patched on first launch
            
            #### Linux
            1. Download and extract `LADXHD-Linux-x64.tar.gz`
            2. Copy the `Content` and `Data` folders from your **Link's Awakening DX HD v1.0.0** installation
            3. Install `xdelta3`:
               - **Arch Linux**: `sudo pacman -S xdelta3`
               - **Ubuntu/Debian**: `sudo apt install xdelta3`
               - **Fedora**: `sudo dnf install xdelta3`
            4. Run the game
               - DesktopGL shaders will be automatically installed from `Shaders-DesktopGL/`
               - Data assets will be automatically patched on first launch
            
            ---
            
            ### What's Included
            
            | Platform | Binary | Shaders | Auto-Patching |
            |----------|--------|---------|---------------|
            | Windows | Self-contained .exe | DirectX (in `Shaders-Windows/`) | Content + Data |
            | Linux | Self-contained binary | OpenGL (in `Shaders-DesktopGL/`) | Data only* |
            
            *Linux skips Content patching because v1.0.0 Content has Windows XNB format. The bundled DesktopGL shaders replace the incompatible Windows shaders.
            
            ---
            
            ### Upgrading from Previous Versions
            
            The game automatically handles upgrades:
            - Original v1.0.0 files are backed up to `Data/Backup/` on first run
            - When upgrading, v1.0.0 is restored from backup before applying new patches
            - This ensures patches always work regardless of your current version
            
            ---
            
            ### Troubleshooting
            
            **"MGFX effect was built for a different platform"**
            - The DesktopGL shaders weren't installed. Check that `Shaders-DesktopGL/` folder exists and run the game again.
            
            **"xdelta3 not found"**
            - Install xdelta3 using your package manager (see Linux instructions above)
            
            **Game crashes on startup (Linux)**
            - Ensure you have SDL2 and OpenAL installed
            - Try running from terminal to see error messages
            
            ---
            
            ### Downloads
            
            | Platform | File | Size |
            |----------|------|------|
            | Windows x64 | `LADXHD-Windows-x64.zip` | ~50MB |
            | Linux x64 | `LADXHD-Linux-x64.tar.gz` | ~50MB |
          files: |
            ./release/LADXHD-Windows-x64.zip
            ./release/LADXHD-Linux-x64.tar.gz
